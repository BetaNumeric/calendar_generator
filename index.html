    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Download, ChevronLeft, ChevronRight, Calendar as CalendarIcon, 
            Archive, Loader2, Globe, Moon, Sun, Type, Sliders, 
            RotateCcw, AlignCenter, AlignLeft, AlignRight,
            ArrowUpToLine, ArrowDownToLine, Minus, Maximize, Slash
        } from 'lucide-react';

        // --- Constants & Config ---

        const LOCALIZATION = {

            },

            },

            },
            no: {

                months: ["Januar", "Februar", "Mars", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Desember"],
                days: ["Mandag", "Tirsdag", "Onsdag", "Torsdag", "Fredag", "Lørdag", "Søndag"]
            },
            sv: {
                name: "Svenska",
                months: ["Januari", "Februari", "Mars", "April", "Maj", "Juni", "Juli", "Augusti", "September", "Oktober", "November", "December"],
                days: ["Måndag", "Tisdag", "Onsdag", "Torsdag", "Fredag", "Lördag", "Söndag"]
            },
            tr: {
                name: "Türkçe",
                months: ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"],
                days: ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"]
            },
            uk: {
                name: "Українська",
                months: ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"],
                days: ["Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота", "Неділя"]
            },
            ru: {
                name: "Русский",
                months: ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"],
                days: ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"]
            },
            el: {
                name: "Ελληνικά",
                months: ["Ιανουάριος", "Φεβρουάριος", "Μάρτιος", "Απρίλιος", "Μάιος", "Ιούνιος", "Ιούλιος", "Αύγουστος", "Σεπτέμβριος", "Οκτώβριος", "Νοέμβριος", "Δεκέμβριος"],
                days: ["Δευτέρα", "Τρίτη", "Τετάρτη", "Πέμπτη", "Παρασκευή", "Σάββατο", "Κυριακή"]
            }
        };

        const FONTS = {
            "Verdana": "Verdana, sans-serif",
            "Helvetica": "Helvetica, Arial, sans-serif",
            "Times New Roman": "'Times New Roman', serif",
            "Courier New": "'Courier New', monospace",
            "Georgia": "Georgia, serif",
            "Trebuchet MS": "'Trebuchet MS', sans-serif"
        };

        const DEFAULTS = {
            textColor: '#6f6f6f',
            bgColor: '#ffffff',
            strokeColor: '#c8c8c8',
            dayFontSize: 55,
            alignX: 'center',
            alignY: 'center',
            margin: 50,
            startOnSunday: false
        };

        const CONFIG = {
          width: 1200,
          height: 900,
          marginTop: 120,
          marginBottom: 50,
        };

        // --- Helper Functions ---

        const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
        const getMaxEventDayForMonth = (month) => month === 1 ? 29 : getDaysInMonth(2025, month);
        const EVENTS_STORAGE_KEY = 'calendar_generator_events_v1';

        const sortEventsByDateAndLabel = (a, b) => a.month - b.month || a.day - b.day || a.label.localeCompare(b.label);
        const getEventSignature = (eventItem) => `${eventItem.month}|${eventItem.day}|${eventItem.label}|${eventItem.color}`;

        const sanitizeStoredEvents = (rawEvents) => {
          if (!Array.isArray(rawEvents)) return [];

          return rawEvents
            .map((eventItem, index) => {
              const month = Number(eventItem?.month);
              const day = Number(eventItem?.day);
              const label = typeof eventItem?.label === 'string' ? eventItem.label.trim().slice(0, 60) : '';
              const color = typeof eventItem?.color === 'string' && /^#[0-9a-fA-F]{6}$/.test(eventItem.color)
                ? eventItem.color
                : DEFAULTS.textColor;

              if (!Number.isInteger(month) || month < 0 || month > 11) return null;
              if (!Number.isInteger(day) || day < 1 || day > getMaxEventDayForMonth(month)) return null;
              if (!label) return null;

              return {
                id: typeof eventItem?.id === 'string' && eventItem.id ? eventItem.id : `evt_${index}_${Date.now()}`,
                month,
                day,
                label,
                color
              };
            })
            .filter(Boolean)
            .sort(sortEventsByDateAndLabel);
        };

        // 0 = Sunday, 1 = Monday ... 6 = Saturday
        const getFirstDayOfMonth = (year, month, startOnSunday) => {
          const day = new Date(year, month, 1).getDay();
          if (startOnSunday) {
              return day; // Sunday (0) is 0, Monday (1) is 1...
          } else {
              // ISO: Monday (1) is 0, Sunday (0) is 6
              return day === 0 ? 6 : day - 1; 
          }
        };

        const getFileName = (monthIndex, year, extension, lang) => {
            const monthNum = String(monthIndex + 1).padStart(2, '0');
            const monthName = LOCALIZATION[lang].months[monthIndex].toLowerCase()
                .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss') 
                .normalize("NFD").replace(/[\u0300-\u036f]/g, ""); 
            return monthNum + '_' + monthName + '_' + year + '.' + extension;
        };

        const escapeXml = (value) => {
          return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&apos;');
        };

        const ellipsizeText = (text, maxChars) => {
          if (maxChars <= 3) return '.'.repeat(Math.max(1, maxChars));
          return text.length > maxChars ? `${text.slice(0, maxChars - 3)}...` : text;
        };

        const wrapTextToLines = (text, maxCharsPerLine, maxLines) => {
          const safeMaxChars = Math.max(3, maxCharsPerLine);
          const safeMaxLines = Math.max(1, maxLines);
          const words = String(text || '').trim().split(/\s+/).filter(Boolean);
          if (words.length === 0) return [''];

          const lines = [];
          let currentLine = '';
          let usedAllWords = true;

          const pushCurrentLine = () => {
            if (currentLine) {
              lines.push(currentLine);
              currentLine = '';
            }
          };

          for (let w = 0; w < words.length; w++) {
            let word = words[w];

            while (word.length > safeMaxChars) {
              const chunk = word.slice(0, safeMaxChars);
              word = word.slice(safeMaxChars);

              if (currentLine) {
                pushCurrentLine();
                if (lines.length >= safeMaxLines) {
                  usedAllWords = false;
                  const lastIndex = lines.length - 1;
                  lines[lastIndex] = ellipsizeText(lines[lastIndex], safeMaxChars);
                  return lines.slice(0, safeMaxLines);
                }
              }

              lines.push(chunk);
              if (lines.length >= safeMaxLines) {
                usedAllWords = false;
                const lastIndex = lines.length - 1;
                lines[lastIndex] = ellipsizeText(lines[lastIndex], safeMaxChars);
                return lines.slice(0, safeMaxLines);
              }
            }

            const nextCandidate = currentLine ? `${currentLine} ${word}` : word;
            if (nextCandidate.length <= safeMaxChars) {
              currentLine = nextCandidate;
              continue;
            }

            pushCurrentLine();
            if (lines.length >= safeMaxLines) {
              usedAllWords = false;
              break;
            }
            currentLine = word;
          }

          pushCurrentLine();

          const result = lines.slice(0, safeMaxLines);
          if (!usedAllWords || lines.length > safeMaxLines) {
            const lastIndex = result.length - 1;
            result[lastIndex] = ellipsizeText(result[lastIndex], safeMaxChars);
          }

          return result;
        };

        const loadJSZip = () => {
          return new Promise((resolve, reject) => {
            if (window.JSZip) {
              resolve(window.JSZip);
            } else {
              reject("JSZip library not found.");
            }
          });
        };

        // --- Core Layout Engine ---

        const calculateCalendarLayout = (year, month, lang, alignX, alignY, dayFontSize, marginX, startOnSunday, events = [], centerEventTextAboveDay = false) => {
          const { width, height, marginTop, marginBottom } = CONFIG;
          let currentLocDays = [...LOCALIZATION[lang].days];
          
          // Rotate days if starting on Sunday
          if (startOnSunday) {
              const sunday = currentLocDays.pop();
              currentLocDays.unshift(sunday);
          }
          
          const daysInMonth = getDaysInMonth(year, month);
          const startDay = getFirstDayOfMonth(year, month, startOnSunday);
          const hasEventsForMonth = !centerEventTextAboveDay && events.some((eventItem) =>
            eventItem.month === month &&
            eventItem.day >= 1 &&
            eventItem.day <= daysInMonth &&
            eventItem.label &&
            eventItem.label.trim() !== ''
          );
          
          const gridWidth = width - (marginX * 2);
          const gridStartY = marginTop + 50; 
          
          const numRows = Math.ceil((startDay + daysInMonth) / 7);
          
          const colWidth = gridWidth / 7;
          const dateAreaHeight = height - (marginTop + 50) - marginBottom;
          const singleRowHeight = dateAreaHeight / numRows;

          // Padding for alignment
          const pad = 15; 

          const dates = [];
          const dayCells = {};
          let dayCounter = 1;
          for (let i = 0; i < numRows; i++) {
            for (let j = 0; j < 7; j++) {
              const cellIndex = i * 7 + j;
              if (cellIndex >= startDay && dayCounter <= daysInMonth) {
                const cellX = marginX + j * colWidth;
                const cellY = gridStartY + i * singleRowHeight;
                
                let x, y, anchor;
                
                // Horizontal Calculation
                if (alignX === 'left') {
                    x = cellX + pad;
                    anchor = 'start';
                } else if (alignX === 'center') {
                    x = cellX + colWidth / 2;
                    anchor = 'middle';
                } else { // right
                    x = cellX + colWidth - pad;
                    anchor = 'end';
                }

                // Vertical Calculation
                if (alignY === 'top') {
                    y = cellY + pad + dayFontSize; 
                } else if (alignY === 'center') {
                    y = cellY + singleRowHeight / 2 + (dayFontSize * 0.35); 
                } else { // bottom
                    y = cellY + singleRowHeight - pad - (hasEventsForMonth ? 18 : 0);
                }

                dates.push({
                  day: dayCounter,
                  x, y, anchor
                });
                dayCells[dayCounter] = {
                  x: cellX,
                  y: cellY,
                  width: colWidth,
                  height: singleRowHeight
                };
                dayCounter++;
              }
            }
          }

          const verticalLines = [1, 2, 3, 4, 5, 6].map(col => ({
            x1: marginX + col * colWidth,
            y1: gridStartY,
            x2: marginX + col * colWidth,
            y2: height - marginBottom
          }));

          const horizontalLines = Array.from({ length: numRows - 1 }, (_, i) => i + 1).map(row => ({
            x1: marginX,
            y1: gridStartY + row * singleRowHeight,
            x2: width - marginX,
            y2: gridStartY + row * singleRowHeight
          }));

          const headers = currentLocDays.map((name, index) => ({
            text: name,
            x: marginX + index * colWidth + colWidth / 2,
            y: marginTop + 35
          }));

          const eventLabels = [];
          const eventsByDay = new Map();
          const maxEventsPerDay = 3;
          const maxLinesPerEvent = 2;
          const eventFontSize = 13;
          const eventLineHeight = eventFontSize + 2;
          const eventPaddingX = 10;
          const eventPaddingBottom = 8;
          const charWidthFactor = 0.72;

          events
            .filter((eventItem) =>
              eventItem.month === month &&
              eventItem.day >= 1 &&
              eventItem.day <= daysInMonth &&
              eventItem.label &&
              eventItem.label.trim() !== ''
            )
            .sort((a, b) => a.day - b.day || a.label.localeCompare(b.label))
            .forEach((eventItem) => {
              if (!eventsByDay.has(eventItem.day)) {
                eventsByDay.set(eventItem.day, []);
              }
              eventsByDay.get(eventItem.day).push(eventItem);
            });

          if (centerEventTextAboveDay) {
            eventsByDay.forEach((dayEvents, day) => {
              const cell = dayCells[day];
              if (!cell || dayEvents.length === 0) return;

              const usableWidth = Math.max(20, cell.width - (eventPaddingX * 2));
              const maxCharsPerLine = Math.max(4, Math.floor(usableWidth / (eventFontSize * charWidthFactor)));
              const maxLinesInCell = Math.max(1, Math.floor((cell.height - 14) / eventLineHeight));

              let centeredLines = [];
              dayEvents.forEach((eventItem) => {
                const wrappedLines = wrapTextToLines(eventItem.label.trim(), maxCharsPerLine, maxLinesPerEvent);
                wrappedLines.forEach((lineText) => {
                  centeredLines.push({
                    text: lineText,
                    color: eventItem.color || DEFAULTS.textColor
                  });
                });
              });

              const wasClipped = centeredLines.length > maxLinesInCell;
              centeredLines = centeredLines.slice(0, maxLinesInCell);
              if (wasClipped && centeredLines.length > 0) {
                const lastIndex = centeredLines.length - 1;
                centeredLines[lastIndex] = {
                  ...centeredLines[lastIndex],
                  text: ellipsizeText(centeredLines[lastIndex].text, maxCharsPerLine)
                };
              }

              const lineCount = centeredLines.length;
              const centerX = cell.x + (cell.width / 2);
              const centerY = cell.y + (cell.height / 2);

              centeredLines.forEach((lineItem, index) => {
                eventLabels.push({
                  text: lineItem.text,
                  x: centerX,
                  y: centerY + (index - ((lineCount - 1) / 2)) * eventLineHeight,
                  color: lineItem.color,
                  anchor: 'middle',
                  day
                });
              });
            });
          } else {
            eventsByDay.forEach((dayEvents, day) => {
              const cell = dayCells[day];
              if (!cell) return;

              const usableWidth = Math.max(24, cell.width - (eventPaddingX * 2));
              const maxCharsPerLine = Math.max(4, Math.floor(usableWidth / (eventFontSize * charWidthFactor)));
              const visibleEvents = dayEvents.slice(0, maxEventsPerDay);
              const hiddenCount = dayEvents.length - visibleEvents.length;
              let defaultLines = [];

              visibleEvents.forEach((eventItem) => {
                const wrappedLines = wrapTextToLines(eventItem.label.trim(), maxCharsPerLine, maxLinesPerEvent);
                wrappedLines.forEach((lineText) => {
                  defaultLines.push({
                    text: lineText,
                    color: eventItem.color || DEFAULTS.textColor
                  });
                });
              });

              if (hiddenCount > 0) {
                defaultLines.push({
                  text: `+${hiddenCount} more`,
                  color: '#6b7280',
                });
              }

              const maxLinesInCell = Math.max(1, Math.floor((cell.height - eventPaddingBottom - 4) / eventLineHeight));
              const wasClipped = defaultLines.length > maxLinesInCell;
              defaultLines = defaultLines.slice(0, maxLinesInCell);
              if (wasClipped && defaultLines.length > 0) {
                const lastIndex = defaultLines.length - 1;
                defaultLines[lastIndex] = {
                  ...defaultLines[lastIndex],
                  text: ellipsizeText(defaultLines[lastIndex].text, maxCharsPerLine)
                };
              }

              const totalLines = defaultLines.length;
              const firstLineY = cell.y + cell.height - eventPaddingBottom - (totalLines - 1) * eventLineHeight;

              defaultLines.forEach((lineItem, index) => {
                eventLabels.push({
                  text: lineItem.text,
                  x: cell.x + eventPaddingX,
                  y: firstLineY + index * eventLineHeight,
                  color: lineItem.color,
                  anchor: 'start',
                  day
                });
              });
            });
          }

          const datesWithOpacity = dates.map((dateItem) => ({
            ...dateItem,
            opacity: centerEventTextAboveDay && eventsByDay.has(dateItem.day) ? 0.45 : 1
          }));

          return { dates: datesWithOpacity, verticalLines, horizontalLines, headers, eventLabels, dayCells };
        };

        // --- SVG Generator (String) ---

        const generateSVGString = (year, month, transparentBg, lang, fontName, colors, dayFontSize, alignX, alignY, marginX, startOnSunday, events = [], centerEventTextAboveDay = false) => {
          const layout = calculateCalendarLayout(year, month, lang, alignX, alignY, dayFontSize, marginX, startOnSunday, events, centerEventTextAboveDay);
          const { width, height } = CONFIG;
          const currentLoc = LOCALIZATION[lang];
          const fontFamily = FONTS[fontName];

          const commonStyle = `font-family:${fontFamily};fill:${colors.textColor}`;
          
          const titleMonthStyle = `${commonStyle};font-size:48pt`;
          const titleYearStyle = `${commonStyle};font-size:48pt;text-anchor:end`;
          const headerStyle = `${commonStyle};font-size:16pt;text-anchor:middle`;
          const lineStyle = `stroke:${colors.strokeColor};stroke-width:1`;
          const dateStyle = `${commonStyle};font-size:${dayFontSize}pt`; 
          const eventStyle = `font-family:${fontFamily};font-size:13pt;font-weight:600`;

          const titleMonth = '<text x="' + marginX + '" y="90" style="' + titleMonthStyle + '">' + escapeXml(currentLoc.months[month]) + '</text>';
          const titleYear = '<text x="' + (width - marginX) + '" y="90" style="' + titleYearStyle + '">' + escapeXml(year) + '</text>';

          const vLines = layout.verticalLines.map(l => 
            '<line x1="' + l.x1 + '" y1="' + l.y1 + '" x2="' + l.x2 + '" y2="' + l.y2 + '" style="' + lineStyle + '" />'
          ).join('');

          const hLines = layout.horizontalLines.map(l => 
            '<line x1="' + l.x1 + '" y1="' + l.y1 + '" x2="' + l.x2 + '" y2="' + l.y2 + '" style="' + lineStyle + '" />'
          ).join('');

          const headers = layout.headers.map(h => 
            '<text x="' + h.x + '" y="' + h.y + '" style="' + headerStyle + '">' + escapeXml(h.text) + '</text>'
          ).join('');

          const dates = layout.dates.map(d => 
            '<text x="' + d.x + '" y="' + d.y + '" style="' + dateStyle + ';text-anchor:' + d.anchor + ';fill-opacity:' + d.opacity + '">' + escapeXml(d.day) + '</text>'
          ).join('');

          const eventLabels = layout.eventLabels.map(e =>
            '<text x="' + e.x + '" y="' + e.y + '" style="' + eventStyle + ';fill:' + e.color + ';text-anchor:' + (e.anchor || 'start') + '">' + escapeXml(e.text) + '</text>'
          ).join('');

          const bgStyle = transparentBg ? '' : 'background-color:' + colors.bgColor + ';';

          return '<?xml version="1.0" standalone="no"?>\n' +
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + ' ' + height + '" width="' + width + '" height="' + height + '" style="' + bgStyle + 'font-family:' + fontFamily + '">' +
              (transparentBg ? '' : '<rect width="100%" height="100%" fill="' + colors.bgColor + '"/>') +
              titleMonth +
              titleYear +
              vLines +
              hLines +
              headers +
              dates +
              eventLabels +
            '</svg>';
        };


        // --- Rasterization Helper ---
        const rasterizeSVG = (svgString, width, height, scale, format, transparent, bgColor) => {
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              canvas.width = width * scale;
              canvas.height = height * scale;
              const ctx = canvas.getContext('2d');
              
              if (format === 'image/jpeg' || !transparent) {
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
              }
              
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL(format, 0.9)); 
            };
            img.onerror = reject;
            img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgString);
          });
        };

        // --- Components ---

        const CalendarSVGComponent = ({ year, month, transparent, lang, fontName, colors, dayFontSize, alignX, alignY, marginX, startOnSunday, events, centerEventTextAboveDay }) => {
          const layout = calculateCalendarLayout(year, month, lang, alignX, alignY, dayFontSize, marginX, startOnSunday, events, centerEventTextAboveDay);
          const { width, height } = CONFIG;
          const currentLoc = LOCALIZATION[lang];
          const fontFamily = FONTS[fontName];
          
          return (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox={"0 0 " + width + " " + height}
              width="100%"
              height="100%"
              style={{ fontFamily: fontFamily }}
            >
              {/* React Preview Background */}
              {!transparent && <rect width="100%" height="100%" fill={colors.bgColor} />}

              <text x={marginX} y={90} style={{ fontSize: '48pt', fill: colors.textColor }}>{currentLoc.months[month]}</text>
              <text x={width - marginX} y={90} style={{ fontSize: '48pt', fill: colors.textColor, textAnchor: 'end' }}>{year}</text>

              {layout.verticalLines.map((l, i) => (
                <line key={'v-' + i} {...l} style={{ stroke: colors.strokeColor, strokeWidth: 1 }} />
              ))}

              {layout.horizontalLines.map((l, i) => (
                <line key={'h-' + i} {...l} style={{ stroke: colors.strokeColor, strokeWidth: 1 }} />
              ))}

              {layout.headers.map((h, i) => (
                <text key={'head-' + i} x={h.x} y={h.y} style={{ fontSize: '16pt', fill: colors.textColor, textAnchor: 'middle' }}>{h.text}</text>
              ))}

              {layout.dates.map((d, i) => (
                <text key={'d-' + i} x={d.x} y={d.y} style={{ fontSize: dayFontSize + 'pt', fill: colors.textColor, textAnchor: d.anchor, fillOpacity: d.opacity }}>{d.day}</text>
              ))}

              {layout.eventLabels.map((e, i) => (
                <text key={'evt-' + i} x={e.x} y={e.y} style={{ fontSize: '13pt', fontWeight: 600, fill: e.color, textAnchor: e.anchor || 'start' }}>{e.text}</text>
              ))}
            </svg>
          );
        };

        // --- Main App ---

        function CalendarApp() {
          const [year, setYear] = useState(new Date().getFullYear() + 1);
          const [activeMonth, setActiveMonth] = useState(0);
          
          // Basic Settings
          const [exportFormat, setExportFormat] = useState('svg');
          const [scale, setScale] = useState(8);
          const [transparent, setTransparent] = useState(false);
          const [isZipping, setIsZipping] = useState(false);
          const [lang, setLang] = useState('en');
          
          // Advanced State
          const [showAdvanced, setShowAdvanced] = useState(false);
          const [textColor, setTextColor] = useState(DEFAULTS.textColor);
          const [bgColor, setBgColor] = useState(DEFAULTS.bgColor);
          const [strokeColor, setStrokeColor] = useState(DEFAULTS.strokeColor);
          const [dayFontSize, setDayFontSize] = useState(DEFAULTS.dayFontSize);
          const [alignX, setAlignX] = useState(DEFAULTS.alignX);
          const [alignY, setAlignY] = useState(DEFAULTS.alignY);
          const [fontName, setFontName] = useState('Verdana');
          const [margin, setMargin] = useState(DEFAULTS.margin);
          const [startOnSunday, setStartOnSunday] = useState(DEFAULTS.startOnSunday);
          const [events, setEvents] = useState(() => {
            try {
              const raw = window.localStorage.getItem(EVENTS_STORAGE_KEY);
              if (!raw) return [];
              return sanitizeStoredEvents(JSON.parse(raw));
            } catch (error) {
              console.error('Failed to load events from local storage:', error);
              return [];
            }
          });
          const [eventMonth, setEventMonth] = useState(0);
          const [eventDay, setEventDay] = useState(1);
          const [eventLabel, setEventLabel] = useState('');
          const [eventColor, setEventColor] = useState(DEFAULTS.textColor);
          const [useDefaultEventColor, setUseDefaultEventColor] = useState(true);
          const [editingEventId, setEditingEventId] = useState(null);
          const [centerEventTextAboveDay, setCenterEventTextAboveDay] = useState(true);
          const [showEventsPanel, setShowEventsPanel] = useState(false);
          const importInputRef = useRef(null);

          useEffect(() => {
            if (exportFormat === 'image/jpeg' && transparent) {
              setTransparent(false);
            }
          }, [exportFormat, transparent]);

          useEffect(() => {
            const maxDay = getMaxEventDayForMonth(eventMonth);
            if (!Number.isInteger(eventDay) || eventDay < 1) {
              setEventDay(1);
            } else if (eventDay > maxDay) {
              setEventDay(maxDay);
            }
          }, [eventMonth, eventDay]);

          useEffect(() => {
            try {
              window.localStorage.setItem(EVENTS_STORAGE_KEY, JSON.stringify(events));
            } catch (error) {
              console.error('Failed to save events to local storage:', error);
            }
          }, [events]);

          useEffect(() => {
            if (useDefaultEventColor && !editingEventId) {
              setEventColor(textColor);
            }
          }, [textColor, useDefaultEventColor, editingEventId]);

          useEffect(() => {
            if (!editingEventId) {
              setEventMonth(activeMonth);
            }
          }, [activeMonth, editingEventId]);

          const getExtension = () => exportFormat === 'svg' ? 'svg' : (exportFormat === 'image/jpeg' ? 'jpg' : 'png');

          // Presets
          const toggleDarkMode = () => {
             if (bgColor === '#ffffff') {
                 setTextColor('#ffffff');
                 setBgColor('#000000');
                 setStrokeColor('#666666');
             } else {
                 setTextColor(DEFAULTS.textColor);
                 setBgColor(DEFAULTS.bgColor);
                 setStrokeColor(DEFAULTS.strokeColor);
             }
          };

          const resetSettings = () => {
              setTextColor(DEFAULTS.textColor);
              setBgColor(DEFAULTS.bgColor);
              setStrokeColor(DEFAULTS.strokeColor);
              setDayFontSize(DEFAULTS.dayFontSize);
              setAlignX(DEFAULTS.alignX);
              setAlignY(DEFAULTS.alignY);
              setFontName('Verdana');
              setMargin(DEFAULTS.margin);
              setStartOnSunday(DEFAULTS.startOnSunday);
              setTransparent(false);
          };

          const downloadFile = (dataUrl, fileName) => {
            const link = document.createElement("a");
            link.href = dataUrl;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const getMonthData = async (monthIndex) => {
              const colors = { textColor, bgColor, strokeColor };
              const svgString = generateSVGString(year, monthIndex, transparent, lang, fontName, colors, dayFontSize, alignX, alignY, margin, startOnSunday, events, centerEventTextAboveDay);
              
              if (exportFormat === 'svg') {
                  return {
                      data: svgString,
                      isBase64: false
                  };
              } else {
                  const dataUrl = await rasterizeSVG(
                    svgString, 
                    CONFIG.width, 
                    CONFIG.height, 
                    scale, 
                    exportFormat, 
                    transparent,
                    bgColor
                  );
                  return {
                      data: dataUrl.split(',')[1],
                      isBase64: true
                  };
              }
          };

          const generateAndDownloadSingle = async (monthIndex) => {
            try {
              const result = await getMonthData(monthIndex);
              const fileName = getFileName(monthIndex, year, getExtension(), lang);
              
              if (result.isBase64) {
                   downloadFile(`data:${exportFormat};base64,${result.data}`, fileName);
              } else {
                   const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(result.data);
                   downloadFile(url, fileName);
              }
            } catch (error) {
              console.error("Single file export failed:", error);
              alert("Failed to generate file. Please try a lower resolution or another format.");
            }
          };

          const clearEventEditor = () => {
            setEditingEventId(null);
            setEventLabel('');
            setUseDefaultEventColor(true);
            setEventColor(textColor);
          };

          const loadEventIntoEditor = (eventItem) => {
            setEditingEventId(eventItem.id);
            setEventMonth(eventItem.month);
            setEventDay(eventItem.day);
            setEventLabel(eventItem.label);
            setUseDefaultEventColor(false);
            setEventColor(eventItem.color || textColor);
          };

          const saveEvent = () => {
            const trimmedLabel = eventLabel.trim();
            if (!trimmedLabel) {
              alert("Please enter an event name.");
              return;
            }

            const normalizedDay = Number(eventDay);
            const maxDay = getMaxEventDayForMonth(eventMonth);
            if (!Number.isInteger(normalizedDay) || normalizedDay < 1 || normalizedDay > maxDay) {
              alert(`Please choose a valid day for ${LOCALIZATION[lang].months[eventMonth]}.`);
              return;
            }

            const eventItem = {
              id: editingEventId || `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
              month: eventMonth,
              day: normalizedDay,
              label: trimmedLabel.slice(0, 60),
              color: eventColor || textColor
            };

            setEvents((prev) => {
              if (editingEventId) {
                return prev
                  .map((current) => (current.id === editingEventId ? eventItem : current))
                  .sort(sortEventsByDateAndLabel);
              }
              return [...prev, eventItem].sort(sortEventsByDateAndLabel);
            });

            clearEventEditor();
          };

          const removeEvent = (id) => {
            setEvents((prev) => prev.filter((eventItem) => eventItem.id !== id));
            if (editingEventId === id) {
              clearEventEditor();
            }
          };

          const removeAllEvents = () => {
            if (events.length === 0) return;
            const confirmed = window.confirm(`Delete all ${events.length} events? This cannot be undone.`);
            if (!confirmed) return;
            setEvents([]);
            clearEventEditor();
          };

          const exportEvents = () => {
            try {
              const payload = {
                version: 1,
                exportedAt: new Date().toISOString(),
                events
              };
              const json = JSON.stringify(payload, null, 2);
              const blob = new Blob([json], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url;
              link.download = `calendar_events_${year}.json`;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              URL.revokeObjectURL(url);
            } catch (error) {
              console.error('Failed to export events:', error);
              alert('Failed to export events.');
            }
          };

          const importEventsFromFile = async (file) => {
            if (!file) return;
            try {
              const text = await file.text();
              const parsed = JSON.parse(text);
              const rawEvents = Array.isArray(parsed) ? parsed : parsed?.events;
              const importedEvents = sanitizeStoredEvents(rawEvents);
              let addedCount = 0;
              let skippedCount = 0;
              setEvents((prev) => {
                const merged = [...prev];
                const existingSignatures = new Set(prev.map(getEventSignature));

                importedEvents.forEach((eventItem) => {
                  const signature = getEventSignature(eventItem);
                  if (existingSignatures.has(signature)) {
                    skippedCount += 1;
                    return;
                  }
                  existingSignatures.add(signature);
                  merged.push(eventItem);
                  addedCount += 1;
                });

                return merged.sort(sortEventsByDateAndLabel);
              });
              clearEventEditor();
              alert(`Imported ${addedCount} new event(s). Skipped ${skippedCount} duplicate(s).`);
            } catch (error) {
              console.error('Failed to import events:', error);
              alert('Invalid events file. Please upload a valid JSON export.');
            }
          };

          const handleImportInputChange = async (event) => {
            const file = event.target.files && event.target.files[0];
            await importEventsFromFile(file);
            event.target.value = '';
          };

          const generateAndDownloadZip = async () => {
            setIsZipping(true);
            try {
                const JSZip = await loadJSZip();
                const zip = new JSZip();
                const folderName = `calendar_${year}_${lang}`;
                const folder = zip.folder(folderName);

                for (let i = 0; i < 12; i++) {
                    const result = await getMonthData(i);
                    const fileName = getFileName(i, year, getExtension(), lang);
                    
                    if (result.isBase64) {
                        folder.file(fileName, result.data, {base64: true});
                    } else {
                        folder.file(fileName, result.data);
                    }
                    if (exportFormat !== 'svg') await new Promise(r => setTimeout(r, 50));
                }

                const zipContent = await zip.generateAsync({type:"blob"});
                const url = URL.createObjectURL(zipContent);
                downloadFile(url, `${folderName}.zip`);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error("Zip failed:", error);
                alert("Failed to generate Zip file. Please try downloading individual files.");
            } finally {
                setIsZipping(false);
            }
          };

          return (
            <div className="flex-1 flex flex-col font-sans text-slate-800">
              
              {/* Top Bar */}
              <header className="bg-white border-b border-gray-200 sticky top-0 z-20 shadow-sm">
                <div className="px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                  
                  <div className="flex items-center gap-3 w-full md:w-auto">
                    <div className="p-2 bg-gray-800 rounded-lg text-white">
                      <CalendarIcon size={24} />
                    </div>
                    <div>
                      <h1 className="text-xl font-bold text-gray-900 tracking-tight leading-tight">Calendar Generator</h1>
                      <p className="text-xs text-gray-500 font-medium uppercase tracking-wider">Vector & Raster</p>
                    </div>
                  </div>

                  {/* Main Toolbar */}
                  <div className="flex flex-wrap items-center gap-4 bg-gray-50 p-2 rounded-xl border border-gray-100">
                     
                     {/* Language */}
                     <div className="flex items-center gap-2 px-2">
                        <Globe size={14} className="text-gray-400" />
                        <select value={lang} onChange={(e) => setLang(e.target.value)} className="bg-transparent text-sm font-semibold text-gray-700 focus:outline-none cursor-pointer w-24">
                            {Object.entries(LOCALIZATION).map(([code, info]) => (
                                <option key={code} value={code}>{info.name}</option>
                            ))}
                        </select>
                     </div>

                     <div className="w-px h-6 bg-gray-200"></div>

                     {/* Format */}
                     <div className="flex items-center bg-white rounded-lg border border-gray-200 p-1">
                        <button onClick={() => setExportFormat('svg')} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-colors ${exportFormat === 'svg' ? 'bg-blue-100 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}>SVG</button>
                        <div className="w-px h-4 bg-gray-200 mx-1"></div>
                        <button onClick={() => setExportFormat('image/png')} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-colors ${exportFormat === 'image/png' ? 'bg-blue-100 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}>PNG</button>
                        <button onClick={() => setExportFormat('image/jpeg')} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-colors ${exportFormat === 'image/jpeg' ? 'bg-blue-100 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}>JPG</button>
                     </div>

                     {/* Resolution */}
                     {exportFormat !== 'svg' && (
                        <div className="flex items-center gap-2 text-xs">
                          <span className="text-gray-400 font-medium">Size:</span>
                          <select value={scale} onChange={(e) => setScale(Number(e.target.value))} className="bg-white border border-gray-200 text-gray-700 text-xs rounded-md px-2 py-1.5 focus:outline-none">
                            <option value={1}>1200px</option>
                            <option value={2}>2400px</option>
                            <option value={4}>4800px</option>
                            <option value={8}>9600px</option>
                          </select>
                        </div>
                     )}

                     <div className="w-px h-6 bg-gray-200"></div>

                     {/* Advanced Toggle */}
                     <button 
                        onClick={() => setShowAdvanced(!showAdvanced)}
                        className={`flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-bold border transition-colors ${showAdvanced ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}
                     >
                        <Sliders size={14} />
                        Adjust
                     </button>
                  </div>

                  {/* Right Actions */}
                  <div className="flex items-center gap-3 w-full md:w-auto justify-end">
                     {/* Year */}
                     <div className="flex items-center bg-gray-100 rounded-lg p-1 border border-gray-200">
                        <button onClick={() => setYear(y => y - 1)} className="p-1.5 hover:bg-white rounded transition-colors text-gray-600"><ChevronLeft size={16} /></button>
                        <span className="w-14 text-center font-bold text-sm text-gray-700 font-mono">{year}</span>
                        <button onClick={() => setYear(y => y + 1)} className="p-1.5 hover:bg-white rounded transition-colors text-gray-600"><ChevronRight size={16} /></button>
                     </div>
                     
                     <button onClick={generateAndDownloadZip} disabled={isZipping} className={`flex items-center gap-2 bg-white border border-gray-200 text-gray-700 px-4 py-2.5 rounded-lg font-medium transition-colors shadow-sm ${isZipping ? 'opacity-75 cursor-wait' : 'hover:bg-gray-50'}`} title="Download Zip">
                      {isZipping ? <Loader2 className="animate-spin" size={20} /> : <Archive size={20} />}
                      <span className="hidden sm:inline">{isZipping ? 'Zipping...' : 'Zip'}</span>
                    </button>

                     <button onClick={() => generateAndDownloadSingle(activeMonth)} disabled={isZipping} className="flex items-center gap-2 bg-gray-900 hover:bg-black text-white px-4 py-2 rounded-lg font-medium transition-colors text-sm">
                      <Download size={16} />
                      <span>Save {exportFormat === 'svg' ? 'SVG' : (exportFormat === 'image/png' ? 'PNG' : 'JPG')}</span>
                    </button>
                  </div>
                </div>

                {/* Advanced Settings Panel */}
                {showAdvanced && (
                    <div className="bg-gray-50 border-t border-gray-200 px-6 py-4 animate-in slide-in-from-top-2 duration-200">
                        <div className="flex flex-wrap gap-8 items-start justify-center max-w-7xl mx-auto">
                            
                            {/* Color Pickers */}
                            <div className="flex flex-col gap-2">
                                <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">Colors</span>
                                <div className="flex items-center gap-3">
                                    <div className="flex items-center gap-3 bg-white px-3 py-2 rounded-lg border border-gray-200">
                                        <div className="flex flex-col items-center gap-1">
                                            <input type="color" value={textColor} onChange={(e) => setTextColor(e.target.value)} title="Text Color" />
                                            <span className="text-[10px] text-gray-500 font-mono">Text</span>
                                        </div>
                                        <div className="w-px h-8 bg-gray-100"></div>
                                        {/* Background Control with Transparency Toggle */}
                                        <div className="flex flex-col items-center gap-1">
                                            <div className="relative group">
                                               <input 
                                                  type="color" 
                                                  value={bgColor} 
                                                  onChange={(e) => { setBgColor(e.target.value); setTransparent(false); }} 
                                                  disabled={transparent}
                                                  title="Background Color" 
                                                  className={`transition-opacity ${transparent ? 'opacity-20 cursor-not-allowed' : 'cursor-pointer'}`}
                                               />
                                               {transparent && (
                                                 <div className="absolute inset-0 flex items-center justify-center pointer-events-none text-gray-400">
                                                    <Slash size={20} />
                                                 </div>
                                               )}
                                            </div>
                                            
                                            <button 
                                                onClick={() => setTransparent(!transparent)}
                                                disabled={exportFormat === 'image/jpeg'}
                                                className={`text-[9px] font-mono uppercase tracking-tight hover:text-blue-600 ${transparent ? 'text-blue-600 font-bold' : 'text-gray-500'} ${exportFormat === 'image/jpeg' ? 'opacity-50 cursor-not-allowed' : ''}`}
                                                title="Toggle Transparent Background"
                                            >
                                                {transparent ? 'None' : 'Fill'}
                                            </button>
                                        </div>
                                        <div className="w-px h-8 bg-gray-100"></div>
                                        <div className="flex flex-col items-center gap-1">
                                            <input type="color" value={strokeColor} onChange={(e) => setStrokeColor(e.target.value)} title="Grid Lines" />
                                            <span className="text-[10px] text-gray-500 font-mono">Grid</span>
                                        </div>
                                    </div>
                                    
                                    <div className="flex flex-col gap-2">
                                        <button onClick={toggleDarkMode} className="p-2 bg-white border border-gray-200 rounded-lg hover:bg-gray-100 text-gray-600" title="Dark Mode Preset">
                                            {bgColor === '#000000' ? <Sun size={16} /> : <Moon size={16} />}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Typography */}
                            <div className="flex flex-col gap-2">
                                <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">Typography</span>
                                <div className="flex flex-col gap-2 bg-white p-3 rounded-lg border border-gray-200">
                                    {/* Font Selector */}
                                    <div className="flex items-center gap-2 border-b border-gray-100 pb-2 mb-2">
                                        <Type size={14} className="text-gray-400" />
                                        <select value={fontName} onChange={(e) => setFontName(e.target.value)} className="bg-transparent text-sm font-semibold text-gray-700 focus:outline-none cursor-pointer w-32">
                                            {Object.keys(FONTS).map((f) => <option key={f} value={f}>{f}</option>)}
                                        </select>
                                    </div>
                                    
                                    {/* Size Slider */}
                                    <div className="flex items-center gap-3">
                                        <span className="text-[10px] text-gray-500 font-mono w-8">Size</span>
                                        <input 
                                            type="range" 
                                            min="20" max="120" 
                                            value={dayFontSize} 
                                            onChange={(e) => setDayFontSize(Number(e.target.value))}
                                            className="w-24 h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                        />
                                        <span className="text-[10px] text-gray-500 font-mono w-6 text-right">{dayFontSize}</span>
                                    </div>
                                </div>
                            </div>

                            {/* Layout */}
                            <div className="flex flex-col gap-2">
                                <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">Layout</span>
                                <div className="flex flex-col gap-2 bg-white p-3 rounded-lg border border-gray-200 h-full justify-between">
                                    
                                    {/* Start of Week Toggle */}
                                    <div className="flex items-center gap-3 border-b border-gray-100 pb-2">
                                        <span className="text-[10px] text-gray-500 font-mono">Week Start</span>
                                        <div className="flex bg-gray-100 p-0.5 rounded text-xs font-medium">
                                            <button 
                                                onClick={() => setStartOnSunday(false)}
                                                className={`px-2 py-0.5 rounded transition-all ${!startOnSunday ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-400 hover:text-gray-600'}`}
                                            >
                                                Mon
                                            </button>
                                            <button 
                                                onClick={() => setStartOnSunday(true)}
                                                className={`px-2 py-0.5 rounded transition-all ${startOnSunday ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-400 hover:text-gray-600'}`}
                                            >
                                                Sun
                                            </button>
                                        </div>
                                    </div>

                                    {/* Margin Slider */}
                                    <div className="flex items-center gap-3">
                                        <span className="text-[10px] text-gray-500 font-mono w-8"><Maximize size={10} className="inline mr-1"/>Pad</span>
                                        <input 
                                            type="range" 
                                            min="0" max="150" 
                                            value={margin} 
                                            onChange={(e) => setMargin(Number(e.target.value))}
                                            className="w-24 h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                        />
                                        <span className="text-[10px] text-gray-500 font-mono w-6 text-right">{margin}</span>
                                    </div>
                                </div>
                            </div>

                            {/* Alignment */}
                            <div className="flex flex-col gap-2">
                                <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">Align</span>
                                <div className="flex gap-2">
                                    <div className="flex flex-col gap-1 bg-white p-1 rounded-lg border border-gray-200 h-full justify-center">
                                        <div className="flex gap-1">
                                            <button onClick={() => setAlignY('top')} className={`p-1.5 rounded hover:bg-gray-100 ${alignY === 'top' ? 'bg-blue-50 text-blue-600' : 'text-gray-400'}`} title="Top"><ArrowUpToLine size={16} /></button>
                                            <button onClick={() => setAlignY('center')} className={`p-1.5 rounded hover:bg-gray-100 ${alignY === 'center' ? 'bg-blue-50 text-blue-600' : 'text-gray-400'}`} title="Center"><Minus size={16} /></button>
                                            <button onClick={() => setAlignY('bottom')} className={`p-1.5 rounded hover:bg-gray-100 ${alignY === 'bottom' ? 'bg-blue-50 text-blue-600' : 'text-gray-400'}`} title="Bottom"><ArrowDownToLine size={16} /></button>
                                        </div>
                                        <div className="flex gap-1 border-t border-gray-100 pt-1">
                                            <button onClick={() => setAlignX('left')} className={`p-1.5 rounded hover:bg-gray-100 ${alignX === 'left' ? 'bg-blue-50 text-blue-600' : 'text-gray-400'}`} title="Left"><AlignLeft size={16} /></button>
                                            <button onClick={() => setAlignX('center')} className={`p-1.5 rounded hover:bg-gray-100 ${alignX === 'center' ? 'bg-blue-50 text-blue-600' : 'text-gray-400'}`} title="Center"><AlignCenter size={16} /></button>
                                            <button onClick={() => setAlignX('right')} className={`p-1.5 rounded hover:bg-gray-100 ${alignX === 'right' ? 'bg-blue-50 text-blue-600' : 'text-gray-400'}`} title="Right"><AlignRight size={16} /></button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Reset */}
                            <div className="flex flex-col gap-2 h-full justify-end pb-1">
                                <button 
                                    onClick={resetSettings}
                                    className="flex items-center gap-1.5 px-3 py-2 text-xs font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors"
                                >
                                    <RotateCcw size={14} />
                                    Reset
                                </button>
                            </div>
                        </div>
                    </div>
                )}
              </header>

              <main className="flex-1 flex flex-col items-center p-8 overflow-y-auto">
                
                {/* Month Tabs */}
                <div className="w-full max-w-5xl mb-6 flex flex-wrap gap-2 justify-center">
                  {LOCALIZATION[lang].months.map((name, index) => (
                    <button
                      key={index}
                      onClick={() => setActiveMonth(index)}
                      className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all ${
                        activeMonth === index
                          ? 'bg-gray-800 text-white shadow-md transform scale-105'
                          : 'bg-white text-gray-500 hover:bg-gray-100 border border-gray-200 hover:text-gray-900'
                      }`}
                    >
                      {name.slice(0, 3)}
                    </button>
                  ))}
                </div>

                <div className="w-full max-w-7xl mb-4 flex justify-end">
                  <button
                    onClick={() => setShowEventsPanel((prev) => !prev)}
                    className="px-3 py-1.5 text-xs font-semibold rounded-md border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 transition-colors"
                  >
                    {showEventsPanel ? 'Hide Events Panel' : 'Events Panel'}
                  </button>
                </div>

                <div className={`w-full ${showEventsPanel ? 'max-w-7xl flex flex-col xl:flex-row gap-6 items-start' : 'max-w-5xl flex justify-center'}`}>
                  {/* Preview Container */}
                  <div className={`${showEventsPanel ? 'w-full xl:flex-1' : 'w-full'} rounded-xl shadow-2xl border border-gray-200 overflow-hidden relative transition-colors duration-300 ${transparent ? 'bg-checkerboard' : ''}`} style={{ backgroundColor: transparent ? '' : bgColor }}>
                    
                    <div className="p-3 border-b border-gray-200 flex justify-between items-center text-xs text-gray-500 font-mono bg-white">
                      <span>Preview: {LOCALIZATION[lang].months[activeMonth]} {year}</span>
                      <span className="flex items-center gap-2">
                          {exportFormat === 'svg' ? 'Vector' : `${scale}x Resolution`}
                          <span className="w-px h-3 bg-gray-300"></span>
                          {Math.round(CONFIG.width)} x {Math.round(CONFIG.height)}px
                      </span>
                    </div>

                    <div className="p-8 md:p-12 overflow-auto flex justify-center">
                      <div className="shadow-sm border border-gray-300 transition-all" style={{ width: '800px', height: '600px', backgroundColor: transparent ? 'transparent' : bgColor }}>
                          <CalendarSVGComponent 
                              year={year} 
                              month={activeMonth} 
                              transparent={transparent} 
                              lang={lang} 
                              fontName={fontName}
                              colors={{ textColor, bgColor, strokeColor }}
                              dayFontSize={dayFontSize}
                              alignX={alignX}
                              alignY={alignY}
                              marginX={margin}
                              startOnSunday={startOnSunday}
                              events={events}
                              centerEventTextAboveDay={centerEventTextAboveDay}
                          />
                        </div>
                    </div>
                  </div>

                  {/* Events Side Panel */}
                  {showEventsPanel && (
                  <aside className="w-full xl:w-80 bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
                    <div className="px-4 py-3 border-b border-gray-100">
                      <h2 className="text-sm font-bold text-gray-800 uppercase tracking-wide">Events</h2>
                      <p className="text-xs text-gray-500 mt-1">Recurring yearly events for all exports</p>
                    </div>

                    <div className="p-4 flex flex-col gap-3">
                      <div className="flex items-center gap-2">
                        <select
                            value={eventMonth}
                            onChange={(e) => setEventMonth(Number(e.target.value))}
                            className="flex-1 bg-white border border-gray-200 text-xs rounded-md px-2 py-1.5 focus:outline-none"
                        >
                            {LOCALIZATION[lang].months.map((monthName, idx) => (
                                <option key={monthName + idx} value={idx}>
                                    {monthName}
                                </option>
                            ))}
                        </select>
                        <input
                            type="number"
                            min="1"
                            max={getMaxEventDayForMonth(eventMonth)}
                            value={eventDay}
                            onChange={(e) => setEventDay(Number(e.target.value))}
                            className="w-20 bg-white border border-gray-200 text-xs rounded-md px-2 py-1.5 focus:outline-none"
                            title="Day"
                        />
                      </div>

                      <div className="flex items-center gap-2">
                        <input
                            type="text"
                            value={eventLabel}
                            onChange={(e) => setEventLabel(e.target.value)}
                            onKeyDown={(e) => {
                                if (e.key === 'Enter') {
                                    e.preventDefault();
                                    saveEvent();
                                }
                            }}
                            placeholder="Birthday, Holiday..."
                            className="flex-1 bg-white border border-gray-200 text-xs rounded-md px-2 py-1.5 focus:outline-none"
                            maxLength={60}
                        />
                        <input
                            type="color"
                            value={eventColor}
                            onChange={(e) => {
                              setUseDefaultEventColor(false);
                              setEventColor(e.target.value);
                            }}
                            title="Event Color"
                        />
                        <button
                            onClick={() => {
                              setUseDefaultEventColor(true);
                              setEventColor(textColor);
                            }}
                            className="px-2 py-1.5 text-[10px] font-semibold rounded-md border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors"
                            title="Use current text color"
                        >
                            Text
                        </button>
                      </div>

                      <div className="flex items-center justify-between gap-2">
                        <label className="flex items-center gap-2 text-xs text-gray-600 select-none cursor-pointer">
                          <input
                              type="checkbox"
                              checked={centerEventTextAboveDay}
                              onChange={(e) => setCenterEventTextAboveDay(e.target.checked)}
                              className="accent-blue-600"
                          />
                          Center event text
                        </label>
                      </div>

                      <div className="flex items-center gap-2">
                        <button
                            onClick={saveEvent}
                            className={`px-3 py-1.5 text-xs font-semibold rounded-md text-white transition-colors ${editingEventId ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-blue-600 hover:bg-blue-700'}`}
                        >
                            {editingEventId ? 'Update' : 'Add'}
                        </button>
                        {editingEventId && (
                          <button
                              onClick={clearEventEditor}
                              className="px-3 py-1.5 text-xs font-semibold rounded-md border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors"
                          >
                              Cancel
                          </button>
                        )}
                      </div>

                      <div className="max-h-80 overflow-y-auto border border-gray-100 rounded-md">
                        <div className="flex items-center justify-between gap-2 px-2 py-1.5 border-b border-gray-100 bg-gray-50">
                          <span className="text-[10px] font-semibold uppercase tracking-wide text-gray-500">Date / Event</span>
                          <button
                            onClick={removeAllEvents}
                            disabled={events.length === 0}
                            className={`text-[10px] font-semibold ${events.length === 0 ? 'text-gray-300 cursor-not-allowed' : 'text-red-500 hover:text-red-700'}`}
                            title="Remove all events"
                          >
                            Remove All
                          </button>
                        </div>
                        {events.length === 0 ? (
                            <div className="text-[11px] text-gray-400 px-2 py-2">No events yet.</div>
                        ) : (
                            events.map((eventItem) => (
                                <div
                                  key={eventItem.id}
                                  onClick={() => {
                                    setActiveMonth(eventItem.month);
                                    loadEventIntoEditor(eventItem);
                                  }}
                                  className={`flex items-center justify-between gap-2 px-2 py-1.5 border-b border-gray-100 last:border-b-0 cursor-pointer transition-colors ${editingEventId === eventItem.id ? 'bg-blue-50' : 'hover:bg-gray-50'}`}
                                >
                                    <div className="flex items-center gap-2 min-w-0">
                                        <span
                                            className="inline-block w-2 h-2 rounded-full shrink-0"
                                            style={{ backgroundColor: eventItem.color }}
                                        ></span>
                                        <span className="text-[11px] text-gray-600 font-mono shrink-0">
                                            {String(eventItem.day).padStart(2, '0')}.{String(eventItem.month + 1).padStart(2, '0')}
                                        </span>
                                        <span className="text-xs text-gray-700 truncate">{eventItem.label}</span>
                                    </div>
                                    <button
                                        onClick={(e) => {
                                          e.stopPropagation();
                                          removeEvent(eventItem.id);
                                        }}
                                        className="text-[11px] text-red-500 hover:text-red-700"
                                        title="Remove Event"
                                    >
                                        Remove
                                    </button>
                                </div>
                            ))
                        )}
                      </div>

                      <div className="flex items-center gap-2">
                        <button
                          onClick={exportEvents}
                          className="flex-1 px-3 py-1.5 text-xs font-semibold rounded-md border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 transition-colors"
                        >
                          Export Events
                        </button>
                        <button
                          onClick={() => importInputRef.current && importInputRef.current.click()}
                          className="flex-1 px-3 py-1.5 text-xs font-semibold rounded-md border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 transition-colors"
                        >
                          Import Events
                        </button>
                        <input
                          ref={importInputRef}
                          type="file"
                          accept="application/json,.json"
                          onChange={handleImportInputChange}
                          className="hidden"
                        />
                      </div>

                    </div>
                  </aside>
                  )}
                </div>
                
                <div className="mt-8 max-w-2xl text-center text-gray-500 text-xs">
                   <p>Tip: Use <strong>4x</strong> or <strong>8x</strong> resolution for high-quality printing. Transparency is only available for SVG and PNG formats.</p>
                </div>

              </main>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<CalendarApp />);
    </script>
</body>
</html>
